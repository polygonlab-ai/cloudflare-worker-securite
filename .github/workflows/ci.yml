name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions: read the code only.
permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current and previous Node.js LTS lines.
        node: ["24", "26"]
    steps:
      # Actions pinned by commit SHA; Dependabot keeps them up to date.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Tests with coverage (Vitest in the Workers runtime, 90 % minimum)
        run: npm run coverage
